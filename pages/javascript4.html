<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Funciones en JS</h1>
    <button onclick="saludar()">Saludo</button>
    <h3>Parametros y argumentos</h3>
    <button onclick="solicitarDatos()">Ejemplo</button>
    <script>
        function saludar(){
            let nombre=prompt("Escribe tu nombre:");
        
        if(nombre){
            alert("Hola,"+ nombre);
         } else{
            alert("Debes escribir tu nombre");
         }
        }
        function calcularPrecio(precio,cantidad){
            let total=precio*cantidad;
            alert("El precio total es:"+ total)

        }
        function solicitarDatos(){
            let solicitarPrecio=prompt("precio:");
            let solicitarCant=prompt("cantidad:");
            calcularPrecio(solicitarPrecio,solicitarCant);
        }
    </script>
</body>
</html>
